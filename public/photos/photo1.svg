<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Polaroid Card -->
  <rect x="20" y="20" width="560" height="660" rx="16" fill="#fdfcf7" filter="url(#shadow)" />
  <!-- Photo Inner Area -->
  <rect x="50" y="50" width="500" height="500" rx="10" fill="url(#bg1)" />
  <!-- Artistic Illustration: Sunset Beach & Palm -->
  <circle cx="300" cy="280" r="120" fill="#ffd166" opacity="0.9" />
  <path d="M50 420 Q180 380 300 430 T550 410 L550 550 L50 550 Z" fill="#ff5e7e" opacity="0.8" />
  <path d="M50 460 Q200 430 350 480 T550 450 L550 550 L50 550 Z" fill="#d946ef" opacity="0.85" />
  <text x="300" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="70" text-anchor="middle" fill="#ffffff">✨ 🌅</text>
  <!-- Polaroid Caption -->
  <text x="300" y="605" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#33272a">Golden Hour Smiles</text>
  <text x="300" y="640" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle" fill="#887880">Sweet Moments with Bisma</text>
</svg>
